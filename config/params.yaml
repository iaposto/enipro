# enipro Phase 1 configuration — Goat SNP genotyping QC + PCA

# --- Paths ---
project_dir: /home/i/iapostof/projects/enipro
input_prefix: /home/i/iapostof/projects/enipro/test_data/graega_top_alleles/graega_top_alleles
results_dir: /home/i/iapostof/projects/enipro/results
log_dir: /home/i/iapostof/projects/enipro/logs

# --- Species ---
chr_set: 29           # goat autosomes
autosomes: "1-29"
no_xy: true           # no XY pseudo-autosomal region (goat)

# --- QC thresholds ---
qc:
  geno: 0.10          # max per-SNP missing rate
  mind: 0.10          # max per-sample missing rate
  maf: 0.02           # min minor allele frequency
  hwe: 1e-6           # HWE p-value threshold
  king_cutoff: 0.177  # KING kinship (1st-degree relatives)

# --- LD pruning ---
ld_prune:
  window: 50
  step: 5
  r2: 0.2

# --- PCA ---
pca:
  n_pcs: 20

# --- ROH (detectRUNS sliding-window) ---
roh:
  min_length_bp: 1000000
  min_snps: 50
  min_density_bp_per_snp: 70000
  window_size: 50
  max_gap_bp: 100000
  max_missing_window: 5
  max_missing_run: 5
  max_heterozygous_window: 1
  max_heterozygous_run: 1
  window_threshold: 0.05
  length_classes_mb:
    short:
      min: 1
      max: 5
    medium:
      min: 5
      max: 10
    long:
      min: 10

# --- Breed metadata ---
breeds:
  ANG:
    color: "#e41a1c"
    label: Anglonubian
  ARI:
    color: "#377eb8"
    label: Aridaias
  BHA:
    color: "#4daf4a"
    label: Black Halkidikis
  CRO:
    color: "#984ea3"
    label: Crossbreed
  DAM:
    color: "#ff7f00"
    label: Damaskou
  IND:
    color: "#a65628"
    label: Indigenous
  MUR:
    color: "#f781bf"
    label: Murcia
  PAG:
    color: "#999999"
    label: Paggaiou
  SER:
    color: "#66c2a5"
    label: Serres
  SKO:
    color: "#ffd92f"
    label: Skopelou
